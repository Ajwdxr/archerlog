<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe29a" />
      <stop offset="50%" stop-color="#c4a77d" />
      <stop offset="100%" stop-color="#8a6d3f" />
    </linearGradient>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d7a36" />
      <stop offset="100%" stop-color="#142b12" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE (x: 10, y: 10, w: 100, h: 100) -->
  <g transform="translate(10, 10)">
    <!-- Rounded squircle background -->
    <rect width="100" height="100" rx="26" fill="#141414" stroke="#c4a77d" stroke-opacity="0.25" stroke-width="1.5" />
    <rect x="3" y="3" width="94" height="94" rx="23" fill="url(#forestGrad)" fill-opacity="0.35" />

    <!-- Concentric Target Rings -->
    <circle cx="50" cy="50" r="38" stroke="#c4a77d" stroke-opacity="0.12" stroke-width="1" fill="none" />
    <circle cx="50" cy="50" r="28" stroke="#c4a77d" stroke-opacity="0.2" stroke-width="1.2" fill="none" />
    <circle cx="50" cy="50" r="18" stroke="#ffd700" stroke-opacity="0.3" stroke-width="1.2" fill="none" />
    <circle cx="50" cy="50" r="8" fill="#ffd700" fill-opacity="0.85" filter="url(#subtleGlow)" />

    <!-- Traditional Bow Limb (Curved Traditional C-Arc) -->
    <path d="M 28 76 C 18 52, 22 36, 42 22 C 43 21, 45 22, 44 24 C 26 38, 24 50, 32 74 C 33 76, 30 78, 28 76 Z" fill="url(#goldGrad)" />

    <!-- Bow String -->
    <line x1="43" y1="23" x2="30" y2="75" stroke="#f5f0e8" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Ascending Arrow (Flight to Top-Right) -->
    <!-- Arrow Shaft -->
    <line x1="22" y1="78" x2="74" y2="26" stroke="#f5f0e8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Arrow Head (Pointed Razor Broadhead) -->
    <polygon points="78,22 66,25 75,34" fill="url(#goldGrad)" />
    <!-- Arrow Fletching / Feathers -->
    <path d="M 24 76 L 19 81 M 27 73 L 22 78 M 25 75 L 30 80" stroke="#c4a77d" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- BRAND WORDMARK -->
  <g transform="translate(130, 24)">
    <!-- Primary Name -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#f5f0e8">
      ARROW<tspan fill="url(#goldGrad)">LOG</tspan>
    </text>

    <!-- Tagline -->
    <text x="3" y="74" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="6" fill="#c4a77d" fill-opacity="0.85">
      SHOOT · SCORE · SHARE
    </text>

    <!-- Small Malaysian traditional archery badge -->
    <rect x="300" y="58" width="90" height="20" rx="6" fill="#1f3f1b" stroke="#3d7a36" stroke-width="0.8" />
    <text x="345" y="72" font-family="system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="1.5" fill="#a3e635" text-anchor="middle">
      TRADITIONAL
    </text>
  </g>
</svg>
